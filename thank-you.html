<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ευχαριστούμε για το μήνυμά σας</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Source Sans 3", sans-serif;
      background: #f7f4f1;
      color: #172337;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(12, 22, 35, 0.15);
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 14px;
      color: #314560;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 28px;
      color: #556981;
    }

    a.button {
      display: inline-block;
      padding: 14px 28px;
      background: #d9a48b;
      color: #2d1e19;
      font-weight: 600;
      border-radius: 999px;
      text-decoration: none;
      transition: 0.3s ease;
    }

    a.button:hover {
      background: #c78e72;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Σας ευχαριστώ!</h1>
    <p>
      Το μήνυμά σας στάλθηκε με επιτυχία.<br>
      Θα επικοινωνήσω μαζί σας το συντομότερο δυνατό.
    </p>

    <a class="button" href="index.html">Επιστροφή στην αρχική σελίδα</a>
  </div>

</body>
</html>
